  <script>
  <![CDATA[
    window.addEventListener("load", () => {
      const ojos = document.querySelectorAll(".ojo");
      const svg = document.documentElement;

      const posiciones = Array.from(ojos).map(ojo => ({
        ojo,
        x: ojo.getBBox().x + ojo.getBBox().width / 2,
        y: ojo.getBBox().y + ojo.getBBox().height / 2
      }));

      svg.addEventListener("mousemove", e => {
        const punto = svg.createSVGPoint();
        punto.x = e.clientX;
        punto.y = e.clientY;

        const mouse = punto.matrixTransform(
          svg.getScreenCTM().inverse()
        );

        posiciones.forEach(({ ojo, x, y }) => {
          const dx = mouse.x - x;
          const dy = mouse.y - y;
          const angulo = Math.atan2(dy, dx);
          const distancia = Math.min(3, Math.hypot(dx, dy) / 20);

          ojo.setAttribute(
            "transform",
            `translate(${Math.cos(angulo) * distancia} ${Math.sin(angulo) * distancia})`
          );
        });
      });
    });
  ]]>
</script>
</svg>